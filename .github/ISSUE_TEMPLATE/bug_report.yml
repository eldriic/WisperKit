name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WisperKit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.4, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Target app (for paste issues)
      placeholder: "Slack, Chrome, Terminal…"
  - type: textarea
    id: log
    attributes:
      label: Diagnostic log
      description: Last lines of `~/Library/Logs/WisperKit/wisperkit.log` (it contains no transcribed text, only lengths and permission states).
      render: text
