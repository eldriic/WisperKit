name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Core tests
        run: swift test

      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project WisperKit.xcodeproj -scheme WisperKit -configuration Release \
            CODE_SIGN_IDENTITY="-" build -quiet
